<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Practica Github API</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">

  <h2>Buscador de repositorios de Github</h2>
  <p>Practica de Bootstrap + JQuery usando la API de Github</p>

  <div class="form-group mb-3">
    <label for="user">Nombre de usuario:</label>
    <input type="text" class="form-control" id="user" placeholder="por ejemplo: tucantas">
  </div>

  <button class="btn btn-primary" id="btnBuscar">Buscar</button>

  <hr>

  <div id="mensaje"></div>

  <h4 id="titulo" style="display:none;">Followers: <span id="numFollowers"></span></h4>

  <table class="table table-bordered">
    <thead>
    <tr>
      <th>Nombre</th>
      <th>Descripcion</th>
      <th>Followers</th>
    </tr>
    </thead>
    <tbody id="tablaRepos">
    </tbody>
  </table>

</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>

  $(document).ready(function(){

    $("#btnBuscar").click(function(){

      var usuario = $("#user").val();

      if(usuario == ""){
        alert("Escribe un usuario primero");
        return;
      }

      $("#tablaRepos").html(""); // limpio la tabla antes de buscar
      $("#mensaje").html("Cargando...");

      // primero pido los datos del usuario para sacar los followers
      $.get("https://api.github.com/users/" + usuario, function(datosUsuario){

        $("#numFollowers").text(datosUsuario.followers);
        $("#titulo").show();

        // ahora pido los repos del usuario
        $.get("https://api.github.com/users/" + usuario + "/repos", function(repos){

          $("#mensaje").html("");

          for(var i = 0; i < repos.length; i++){

            var nombre = repos[i].name;
            var descripcion = repos[i].description;

            if(descripcion == null){
              descripcion = "-";
            }

            // uso los followers del usuario para todas las filas
            // (github no tiene followers por repo, solo por usuario)
            var fila = "<tr><td>" + nombre + "</td><td>" + descripcion + "</td><td>" + datosUsuario.followers + "</td></tr>";

            $("#tablaRepos").append(fila);

          }

        });

      }).fail(function(){
        $("#mensaje").html("<p style='color:red'>Usuario no encontrado</p>");
      });

    });

  });

</script>

</body>
</html>
